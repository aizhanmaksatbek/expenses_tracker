<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
    <script>
      document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");
    </script>
    <style>
      .kpi-icon { width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center;
                  justify-content: center; border-radius: .75rem; font-size: 1.2rem; }
      .donut { width: 150px; height: 150px; border-radius: 50%; position: relative; flex: none; }
      .donut::after { content: ""; position: absolute; inset: 28px; border-radius: 50%;
                      background: var(--bs-body-bg); }
      .swatch { width: .75rem; height: .75rem; border-radius: 50%; display: inline-block; }
      .card { border-radius: .85rem; }
      .preset-active { pointer-events: none; }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
