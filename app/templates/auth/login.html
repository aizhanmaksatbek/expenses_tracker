{% extends "base.html" %}
{% block title %}Log in · Expense Tracker{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <section class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Log in</h1>
        {% if request.query_params.get("registered") %}
        <div class="alert alert-success" role="status">Account created. You can now log in.</div>
        {% endif %}
        <form action="/auth/login" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label class="form-label" for="username">Username or email</label>
          <input class="form-control mb-3" id="username" name="username" required autocomplete="username">
          <label class="form-label" for="password">Password</label>
          <input class="form-control mb-4" id="password" name="password" type="password" required autocomplete="current-password">
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-center">New here? <a href="/register">Create an account</a></p>
      </div>
    </section>
  </div>
</div>
{% endblock %}
