name: CD - Neptun-Stream
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Download repository code
            - uses: actions/checkout@v3
            # Deploy via SSH
            - uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USERNAME }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                    # Update package index and install dependencies
                    sudo apt-get update
                    sudo apt-get install -y docker.io

                    sudo systemctl enable docker
                    sudo systemctl start docker

                    sudo usermod -aG docker ${{secrets.SSH_USERNAME}}

                    # Verify installations
                    docker --version

                    # Navigate to the project directory and deploy
                    if [ ! -d "expenses_tracker" ]; then
                        git clone https://github.com/aizhanmaksatbek/expenses_tracker.git
                    fi
                    cd expenses_tracker
                    git fetch origin main
                    git reset --hard origin/main
                    docker compose up -d --build
